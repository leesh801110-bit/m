<!doctype html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#2E8B8B"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="수강생관리"/>
<title>수강생 관리 대장</title>
</head><body style="margin:0;background:#F4F7F6;color:#1F2A28;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<div id="s" style="padding:40px 22px;font-size:15px;line-height:1.7">화면을 불러오는 중…</div>
<script>
/* 이 파일은 문 역할만 합니다 - 진짜 화면은 아래 주소에서 그때그때 받아옵니다.
   그래서 프로그램을 고쳐도 이 파일은 다시 올릴 필요가 없습니다. */
var SRC = "https://wsciiqjfdewkbajmddhh.supabase.co/storage/v1/object/public/app/m.html";
var box = document.getElementById("s");
fetch(SRC, { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error("보관소 응답 " + r.status); return r.text(); })
  .then(function (html) {
    if (html.indexOf("<!doctype") < 0 && html.indexOf("<!DOCTYPE") < 0)
      throw new Error("화면 파일이 아직 올라오지 않았습니다");
    document.open(); document.write(html); document.close();
  })
  .catch(function (e) {
    box.innerHTML = "<b>화면을 불러오지 못했습니다.</b><br><br>" +
      String(e && e.message || e).replace(/[<>&]/g, "") +
      "<br><br>PC 프로그램에서 <b>[휴대폰 연동] → [켜고 지금 맞추기]</b> 를 한 번 눌러 주신 뒤, " +
      "이 화면을 새로고침해 주세요.";
  });
</script></body></html>
